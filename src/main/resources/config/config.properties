
# Device configs are in devices.json (local/remote ? android/ios)
environment=local
platform=Android
#Android or iOS

appium.server.url=http://127.0.0.1:4723

# ?? Appium Server Auto-Start (local execution only) ??
# When enabled, framework starts Appium servers automatically ? no manual start needed.
# Each parallel thread gets its own server on a unique port (4723, 4724, 4725, ...).
# Skipped entirely for remote/cloud execution (Sauce Labs, BrowserStack, etc.).
appium.auto.start=true
appium.base.port=4723
appium.startup.timeout=120
# appium.path=                    # Custom appium JS path (empty = auto-detect from PATH)
# Example macOS:  /opt/homebrew/lib/node_modules/appium/build/lib/main.js
# Example Windows: C:\\Users\\user\\AppData\\Roaming\\npm\\node_modules\\appium\\build\\lib\\main.js

# Set grid.enabled=true to route through a Grid hub or Appium Node
grid.enabled=false
# grid.node.name=node1   # optional: route to specific node

# waits
implicit.wait=10
explicit.wait=20

# FluentWait configuration (applies to ALL BasePage actions)
fluent.wait.timeout=10
fluent.wait.polling=500
fluent.wait.short.timeout=5

# Retry configuration (retries failed tests automatically)
retry.max.count=1
# Set to 0 to disable retries, or any number (e.g., 2 = retry up to 2 times)
# Override at runtime: mvn test -Dretry.max.count=3

# AI model configuration
openai.api.key=YOUR_OPENAI_API_KEY
ai.model=gpt-4
visual.tolerance=0.02

# Self-Healing toggle (true = enabled, false = disabled)
# When disabled, element not found will throw immediately without attempting healing.
# Override at runtime: mvn test -Dself.healing.enabled=false
self.healing.enabled=true


# Web configuration
web.browser=chrome
web.headless=false
web.maximize=true
web.grid.enabled=false
web.grid.hub.url=http://selenium-grid:4444/wd/hub
web.mobile.device=
page.load.timeout=30

# WebDriverManager Auto-Download Settings
# web.driver.version=120.0.6099.109   # Force specific driver version (optional)
# web.driver.arch=64                  # Force architecture: 32, 64, arm64 (optional)
# web.driver.cache.ttl=30             # Driver cache time-to-live in days (default: 30)
# web.driver.proxy=http://proxy:8080 # Proxy for corporate networks (optional)

#
# android.chromedriver.path=/path/to/chromedriver  # Manual override (optional)
# Leave empty for WebDriverManager auto-download

#API and GraphQL configuration
api.base.url=https://api.example.com
graphql.endpoint=https://api.example.com/graphql
